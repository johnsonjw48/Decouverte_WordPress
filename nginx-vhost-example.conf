# Configuration nginx pour WordPress avec sous-domaine
# À placer dans : /etc/nginx/sites-available/wordpress
#
# REMPLACER :
#   - blog.james-johnson.fr → votre sous-domaine
#   - 8083 → le port de votre WordPress (voir .env)

# HTTP - Redirection vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name blog.james-johnson.fr;

    # Let's Encrypt challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirection HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Configuration principale
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.james-johnson.fr;

    # Certificats SSL (obtenus via certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/blog.james-johnson.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.james-johnson.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Taille max upload (pour WordPress)
    client_max_body_size 100M;

    # Proxy vers WordPress (Docker sur port 8083)
    location / {
        proxy_pass http://localhost:8083;
        proxy_http_version 1.1;

        # Headers pour WordPress
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffers
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # Logs
    access_log /var/log/nginx/wordpress_access.log;
    error_log /var/log/nginx/wordpress_error.log;
}
